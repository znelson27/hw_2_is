
<form action="/app/createCourse" method="post">
  {% csrf_token %}
  <input type="text" name="course-name">
  <input type="time" name="start-time">
  <input type="time" name="end-time">
  <input type="checkbox" name="day-mon"> Mon
  <input type="checkbox" name="day-tue"> Tue
  <input type="checkbox" name="day-wed"> Wed
  <input type="checkbox" name="day-thu"> Thu
  <input type="checkbox" name="day-fri"> Fri
  <button type="submit">Create Course</button>
</form>
