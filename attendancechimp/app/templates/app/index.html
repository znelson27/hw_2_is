<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>

<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>Web application that tracks class attendance using QR codes.</p>
    <hr>
<div class="username">
   {% if user.is_authenticated %}
      {{ user.username }}
   {% else %}
      Not logged in.
   {% endif %}
<div class="time-display">
   Current Time: {{ current_time }}
</div>
</body>

</html>
